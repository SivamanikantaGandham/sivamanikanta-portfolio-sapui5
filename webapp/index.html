<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sivamanikanta Gandham | Senior SAP UI5 / Fiori Consultant</title>
	<meta name="description" content="Portfolio of Sivamanikanta Gandham, Senior SAP UI5 / Fiori Consultant specializing in SAP UI5, Fiori Elements, SAP BTP, CAPM, OData and enterprise cloud applications." />

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

	<script
		id="sap-ui-bootstrap"
		src="https://sdk.openui5.org/1.150.0/resources/sap-ui-core.js"
		data-sap-ui-theme="sap_horizon_dark"
		data-sap-ui-resourceroots='{"sivamanikanta.portfolio": "./"}'
		data-sap-ui-compatVersion="edge"
		data-sap-ui-async="true"
		data-sap-ui-frameOptions="trusted"
		data-sap-ui-libs="sap.m, sap.ui.layout, sap.f, sap.tnt">
	</script>

	<script>
		sap.ui.getCore().attachInit(function () {
			sap.ui.require(["sap/ui/core/ComponentSupport"]);
		});
	</script>
</head>
<body class="sapUiBody" id="content">
	<div
		data-sap-ui-component
		data-name="sivamanikanta.portfolio"
		data-id="container"
		data-settings='{"id" : "sivamanikanta.portfolio"}'
		style="height: 100%;">
	</div>
</body>
</html>
